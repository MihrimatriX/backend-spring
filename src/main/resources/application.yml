# Base Configuration
spring:
  application:
    name: ecommerce-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    # docs/API_CONTRACT.md §1 — nesne içindeki null alanlar yazılır, bilinmeyen alanlar yok sayılır
    default-property-inclusion: always
    deserialization:
      fail-on-unknown-properties: false

server:
  error:
    whitelabel:
      enabled: false

# Feature flags (overridden per profile)
app:
  integration:
    redis: true
  messaging:
    enabled: false
  ecommerce:
    # Üretimde kapalı tutun; dev/docker’da sipariş kargo simülasyonu için açılabilir
    demo-fulfillment-enabled: false
  # Bu e-postalar "Admin" rolü alır (.NET: Auth:AdminEmails)
  auth:
    admin-emails: ${ADMIN_EMAILS:admin@example.com,manager@shop.demo}
  # Kargo kuralları (TRY) — .NET: Checkout:*
  checkout:
    free-shipping-threshold: 150.00
    standard-shipping-fee: 34.99
    simulated-payment-decline-percent: 0
  # IP başına dakikalık istek limiti; 0 = kapalı
  rate-limit:
    permit-per-minute: ${RATE_LIMIT:300}
  # Hata cevaplarında "error" alanına teknik ayrıntı yaz (yalnızca geliştirme)
  expose-error-details: false

# Resilience4j — transient broker / network failures (orderEvents)
resilience4j:
  retry:
    instances:
      orderEvents:
        maxAttempts: 3
        waitDuration: 200ms
  circuitbreaker:
    instances:
      orderEvents:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 30s

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:mySecretKeyThatIsAtLeast256BitsLongForJWTTokenSecurity}
  expiration: ${JWT_EXPIRATION:86400000} # 24 saat (ms)
  issuer: ${JWT_ISSUER:EcommerceBackend}
  audience: ${JWT_AUDIENCE:EcommerceUsers}

# CORS Configuration
cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

# Varsayılan log formatı — korelasyon kimliği destek ve hata ayıklama için
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [cid=%X{correlationId:-}] %logger{40} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [cid=%X{correlationId:-}] %logger{40} - %msg%n"

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
