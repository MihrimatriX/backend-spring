# Base Configuration
spring:
  application:
    name: ecommerce-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

# Feature flags (overridden per profile)
app:
  integration:
    redis: true
  messaging:
    enabled: false
  ecommerce:
    # Üretimde kapalı tutun; dev/docker’da sipariş kargo simülasyonu için açılabilir
    demo-fulfillment-enabled: false

# Resilience4j — transient broker / network failures (orderEvents)
resilience4j:
  retry:
    instances:
      orderEvents:
        maxAttempts: 3
        waitDuration: 200ms
  circuitbreaker:
    instances:
      orderEvents:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 30s

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:mySecretKeyThatIsAtLeast256BitsLongForJWTTokenSecurity}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours

# CORS Configuration
cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

# Security Configuration
security:
  rate-limit:
    requests-per-minute: ${RATE_LIMIT:100}

# Varsayılan log formatı — korelasyon kimliği destek ve hata ayıklama için
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [cid=%X{correlationId:-}] %logger{40} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [cid=%X{correlationId:-}] %logger{40} - %msg%n"

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
