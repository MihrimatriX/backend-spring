version: '3.8'

services:
  # Spring Boot Application (Development)
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ecommerce-backend-dev
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JWT_SECRET: dev-secret-key-for-development-only
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8080,http://localhost:8081
      RATE_LIMIT: 100
    ports:
      - "8081:8081"
    volumes:
      - ../src:/app/src
      - ../target:/app/target
    networks:
      - ecommerce-dev-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # H2 Database (Development)
  h2:
    image: oscarfonts/h2:latest
    container_name: ecommerce-h2-dev
    ports:
      - "8082:8082"
    environment:
      H2_OPTIONS: -web -webAllowOthers -tcp -tcpAllowOthers -browser
    networks:
      - ecommerce-dev-network
    restart: unless-stopped

networks:
  ecommerce-dev-network:
    driver: bridge
